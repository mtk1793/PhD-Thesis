name: Export complete CAPSM tracked GitHub repository
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capsm-export-repo.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive tracked files without git metadata
        run: |
          git archive --format=zip --output=/tmp/CAPSM_PhD_Thesis_GitHub_master_2026-11-08.zip HEAD
          unzip -tq /tmp/CAPSM_PhD_Thesis_GitHub_master_2026-11-08.zip | tail -1
          ls -lh /tmp/CAPSM_PhD_Thesis_GitHub_master_2026-11-08.zip
      - name: Preserve tracked repository snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsm-repo-master-2026-11-08
          path: /tmp/CAPSM_PhD_Thesis_GitHub_master_2026-11-08.zip
          compression-level: 0
          retention-days: 7
