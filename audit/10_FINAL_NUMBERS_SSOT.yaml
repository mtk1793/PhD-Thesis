# 10_FINAL_NUMBERS_SSOT.yaml
# Single source of truth for all final numerical values used in the thesis.
# Master plan §3: no chapter may hard-code a performance value independently
# once this file exists. Every value carries an evidence class E1-E5.
#
# Status codes:
#   FROZEN        — measured, traceable, final for the thesis
#   SUPERSEDED    — Stage-1 value retained for provenance only; replaced by rerun
#   PENDING_RERUN — fill from the revised pipeline outputs (phase4_v2/5_v2/5b/6_v2/7/8)
#
# Rerun commands (repository root: capsim_sim/):
#   python scripts/phase4_system1.py            # System 1 leakage-free retrain
#   python scripts/phase5_system2.py            # System 2 counterfactual evaluation
#   python scripts/phase5b_surrogate_validation.py
#   python scripts/phase6_arbiter.py            # full CAPSM
#   python scripts/phase7_ablations.py          # QIRL + arbiter ablations
#   python scripts/phase8_statistics.py         # bootstrap statistics
#   python scripts/phase4b_seasonal.py          # full-2019 seasonal evaluation

